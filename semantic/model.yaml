business_summary: Cadena mexicana que opera restaurantes y tiendas de autoservicio, con 12 locales en varias ciudades
  y regiones. El DW captura las ventas a nivel de línea de ticket (FCT_VTA, con más de 1.9 millones de filas entre
  2025 y noviembre de 2026), las devoluciones de producto con su motivo (FCT_DEV) y la foto semanal de existencias
  y costos unitarios por tienda y producto (FCT_INV). Alrededor de estos hechos están los catálogos de clientes,
  empleados, productos, líneas, tiendas, regiones, motivos de devolución y el calendario.
tables:
- name: AUD_BITACORA
  role: audit
  business_name: Bitácora de auditoría de cambios en el data warehouse
  description: Registro histórico de operaciones de inserción, actualización y borrado realizadas sobre tablas del
    data warehouse de la cadena (restaurantes y tiendas de autoservicio). Cada fila documenta quién hizo el cambio,
    en qué tabla, qué tipo de operación fue y cuándo ocurrió. Se usa para trazabilidad y control; no contiene los
    valores anteriores ni nuevos del registro modificado (supuesto). Las tablas auditadas que aparecen son DIM_PROD,
    FCT_VTA y FCT_DEV. El volumen actual es de unas 500 filas.
  grain: ''
  row_count: 500
  primary_key: []
  columns:
  - name: BIT_ID
    data_type: NUMBER(38,0)
    business_name: Identificador de la bitácora
    description: Número consecutivo que identifica cada evento de auditoría. Es único en las 500 filas, por lo que
      funciona como llave natural aunque la tabla no tenga PK declarada (supuesto).
    role: key
    synonyms:
    - folio de bitácora
    - id de auditoría
    - consecutivo de bitácora
    values: {}
    samples: []
    num_distinct: 500
  - name: USR_CVE
    data_type: VARCHAR2
    business_name: Usuario que ejecutó el cambio
    description: 'Clave del usuario o proceso que realizó la operación. Hay tres valores: JPEREZ (persona), ETL_USR
      (cuenta de carga automática de datos) y ADMIN (cuenta administrativa). La descripción de cada usuario se infiere
      del nombre (supuesto).'
    role: attribute
    synonyms:
    - usuario
    - clave de usuario
    - quién hizo el cambio
    - responsable
    values:
      JPEREZ: Usuario individual (persona, supuesto)
      ETL_USR: Cuenta de proceso ETL de carga de datos (supuesto)
      ADMIN: Cuenta administrativa (supuesto)
    samples:
    - JPEREZ
    - ETL_USR
    - ADMIN
    num_distinct: 3
  - name: TBL_NOM
    data_type: VARCHAR2
    business_name: Tabla afectada
    description: Nombre de la tabla del data warehouse sobre la que se hizo el cambio. Las convenciones de prefijo
      sugieren DIM_ para dimensiones y FCT_ para tablas de hechos.
    role: code
    synonyms:
    - tabla
    - nombre de tabla
    - tabla modificada
    - objeto afectado
    values:
      DIM_PROD: Dimensión de productos (supuesto)
      FCT_VTA: Hechos de ventas (supuesto)
      FCT_DEV: Hechos de devoluciones (supuesto)
    samples:
    - FCT_VTA
    - DIM_PROD
    - FCT_DEV
    num_distinct: 3
  - name: ACC_CVE
    data_type: VARCHAR2
    business_name: Tipo de operación
    description: 'Código de la acción realizada sobre el registro: alta, modificación o baja.'
    role: code
    synonyms:
    - acción
    - operación
    - tipo de cambio
    - evento
    values:
      INS: Inserción (alta de registro)
      UPD: Actualización (modificación de registro)
      DEL: Borrado (baja de registro)
    samples:
    - INS
    - UPD
    - DEL
    num_distinct: 3
  - name: TS_REG
    data_type: TIMESTAMP
    business_name: Fecha y hora del registro
    description: Fecha y hora exactas en que se registró el evento de auditoría. El rango observado va del 1 de
      enero al 27 de octubre de 2026.
    role: date
    synonyms:
    - fecha de cambio
    - fecha de auditoría
    - timestamp
    - momento del evento
    - fecha de registro
    values: {}
    samples: []
    num_distinct: 500
  use_in_answers: false
- name: DIM_CTE
  role: dimension
  business_name: Dimensión de clientes
  description: 'Catálogo de clientes de la cadena (restaurantes y tiendas de autoservicio). Cada fila es una persona
    o cuenta cliente con su nombre y su segmento. Es referenciada por FCT_VTA.CTE_ID, por lo que sirve para analizar
    ventas por cliente o segmento. Incluye un registro genérico ''PUBLICO EN GENERAL'' (supuesto: representa ventas
    sin cliente identificado). Los códigos de segmento se interpretan a partir de sus valores y no están documentados
    en el esquema (supuesto).'
  grain: ''
  row_count: 2001
  primary_key:
  - CTE_ID
  columns:
  - name: CTE_ID
    data_type: NUMBER(38,0)
    business_name: Identificador de cliente
    description: Clave primaria numérica del cliente. Va de 0 a 2000 sin huecos (2001 valores distintos). Es la
      llave que usa FCT_VTA para ligar cada venta con su cliente.
    role: key
    synonyms:
    - ID cliente
    - clave cliente
    - no. cliente
    values: {}
    samples: []
    num_distinct: 2001
  - name: CTE_NOM
    data_type: VARCHAR2
    business_name: Nombre del cliente
    description: 'Nombre completo del cliente (nombre y apellidos). Incluye el registro genérico ''PUBLICO EN GENERAL''
      (supuesto: cliente no identificado).'
    role: attribute
    synonyms:
    - cliente
    - nombre cliente
    - comprador
    - consumidor
    - nombre
    values: {}
    samples:
    - PUBLICO EN GENERAL
    - CLAUDIA LÓPEZ RAMÍREZ
    - LUIS PÉREZ TORRES
    - PATRICIA MEDINA MARTÍNEZ
    - RAÚL LÓPEZ DÍAZ
    - EDUARDO REYES HERRERA
    - DIANA HERRERA GONZÁLEZ
    - ADRIANA MORALES CASTILLO
