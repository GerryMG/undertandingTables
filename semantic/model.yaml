rules:
- Venta neta = SUM(IMP_NTO) de FCT_VTA. Es la base de ingresos y ya descuenta promociones. Se asume IMP_NTO = IMP_BRT
  - IMP_DSC (supuesto, verificable en datos).
- Los importes de FCT_VTA son sin IVA. El IVA se reporta aparte en IMP_IVA con tasa aparente de 16% (supuesto).
- Cada fila de FCT_VTA es una línea de ticket. Para contar ventas usar COUNT(DISTINCT TKT_NUM), nunca COUNT(*),
  porque un ticket tiene varias líneas.
- FCT_DEV es un flujo separado de FCT_VTA y no se resta de forma automática. Combinarlos solo a nivel de periodo
  y confirmando que ambos importes estén en la misma base fiscal.
- En FCT_DEV, TKT_ORIG nulo (927 registros) significa devolución sin ticket de venta identificado.
- 'Las existencias de FCT_INV son saldos semi-aditivos: no se suman entre semanas. Para un periodo usar una fecha
  de corte, un promedio o el último corte.'
- Valor de inventario = SUM(EXIST_CANT*CST_UNIT) dentro de una misma fecha de corte. CST_UNIT es costo, no precio
  de venta.
- PRC_LST es precio de referencia del catálogo. El precio efectivo cobrado se aproxima con IMP_BRT / CANT de FCT_VTA
  (supuesto).
- 'En DIM_TDA, TDA_TP indica el tipo de local: R = Restaurante, T = Tienda de autoservicio (según comentario de
  la columna). Hay 6 de cada tipo.'
- El calendario DIM_FEC se une siempre por FEC_ID (formato AAAAMMDD). Las consultas por fecha deben usar esta dimensión
  y no conversiones ad hoc.
- 'Las horas no son comparables entre tablas sin ajuste: HR_VTA va de 8 a 23 y HR_DEV de 0 a 22.'
- FCT_INV solo contiene 6 tiendas (IDs 6, 7, 8, 9, 10 y 12) y 45 productos (IDs 1027 a 1071), por lo que no representa
  el catálogo completo.
- Las fechas de corte de FCT_INV son domingos (supuesto, coherente con el rango observado).
- Todo el catálogo de productos se mide en pieza (UOM_CVE = PZA).
- El registro 'PUBLICO EN GENERAL' de DIM_CTE representa ventas sin cliente identificado (supuesto). Su CTE_ID no
  está confirmado; el valor 0 es una hipótesis.
- Los motivos de devolución (MTV_CVE) se decodifican desde DIM_MTV. Las etiquetas de significado de cada código
  son supuestos a partir de su abreviatura.
open_questions:
- question: ¿Qué significa cada código de segmento de cliente (GEN, FRE, EMP)?
  proposed_answer: 'Propuesta: GEN = público general, FRE = cliente frecuente, EMP = empresa o corporativo. Confirmar
    con el negocio.'
- question: ¿Qué CTE_ID corresponde al registro genérico 'PUBLICO EN GENERAL' y el valor 0 de FCT_VTA representa
    lo mismo?
  proposed_answer: 'Propuesta: el valor 0 es el público general. Verificar con una consulta directa sobre DIM_CTE.'
- question: ¿Qué significa LIN_TP y qué línea tiene el código A?
  proposed_answer: 'Propuesta: T = tienda, R = restaurante, A = ambos. Hay 6 candidatas para T y solo 5 posiciones,
    así que una línea es ambigua. Confirmar con el equipo de datos.'
- question: ¿Los códigos de puesto CAJ, MES y GTE corresponden a cajero, mesero y gerente?
  proposed_answer: 'Propuesta: sí, por las abreviaturas. Confirmar con Recursos Humanos.'
- question: ¿Por qué DIM_EMP tiene aproximadamente 78 empleados si FCT_VTA solo registra 66 y FCT_DEV 43?
  proposed_answer: 'Propuesta: no todos los empleados registran ventas o devoluciones en el periodo, o hay empleados
    inactivos en el catálogo. Confirmar si el catálogo incluye bajas.'
- question: ¿Por qué FCT_INV excluye la tienda 11 y 39 de los 45 productos del catálogo?
  proposed_answer: 'Propuesta: la tienda 11 está cerrada o no se incluye en la foto de inventario, y el subconjunto
    de productos es intencional. Confirmar el alcance real del inventario.'
- question: ¿El prefijo de TKT_NUM (01 a 12) corresponde siempre al TDA_ID?
  proposed_answer: 'Propuesta: sí, por la coincidencia de rangos. Verificar con una consulta que compare prefijo
    y TDA_ID en FCT_VTA.'
- question: ¿La combinación TKT_NUM + TKT_LIN identifica de forma única cada línea de FCT_VTA?
  proposed_answer: 'Propuesta: sí, es la clave natural probable. Verificar que no haya duplicados antes de usarla
    para conteos.'
- question: ¿La combinación FEC_ID + TDA_ID + PRD_ID es única en FCT_INV?
  proposed_answer: 'Propuesta: sí, por la foto semanal completa (97 × 6 × 45 = 26,190 filas). Verificar.'
- question: ¿IMP_DEV incluye IVA? ¿Las devoluciones se valoran al precio cobrado?
  proposed_answer: 'Propuesta: no se sabe. Antes de calcular tasa_devolucion, confirmar la base de IMP_DEV frente
    a IMP_NTO.'
- question: ¿La semana de DIM_FEC (SEM_ANIO) sigue la norma ISO o una numeración propia?
  proposed_answer: 'Propuesta: no se sabe; el rango de 1 a 52 sugiere numeración propia. Si se comparan reportes
    con otros sistemas, definir la regla.'
- question: ¿FES_FLG marca solo festivos oficiales de México o también días de promoción de la cadena?
  proposed_answer: 'Propuesta: festivos oficiales (supuesto). Confirmar si existen días promocionales en otra tabla.'
- question: ¿El calendario DIM_FEC se extenderá más allá de noviembre de 2026?
  proposed_answer: 'Propuesta: sí, si el DW sigue operando. Confirmar la fecha de cierre del calendario actual.'
- question: ¿Las regiones de DIM_RGN corresponden a las regiones internas de la empresa y qué RGN_ID corresponde
    a cada nombre?
  proposed_answer: 'Propuesta: son agrupaciones operativas internas. El mapeo RGN_ID a nombre no está verificado
    en los datos; confirmarlo con una consulta directa.'
- question: ¿La unidad de medida de EXIST_CANT es piezas o unidades de venta?
  proposed_answer: 'Propuesta: piezas, por coherencia con UOM_CVE = PZA. Confirmar con el área de inventarios.'
- question: ¿CST_UNIT es costo promedio, costo estándar o costo de última compra?
  proposed_answer: 'Propuesta: costo promedio (supuesto). Confirmar el método de valuación, porque afecta el valor
    del inventario.'
- question: ¿Por qué la clave de DIM_PROD incluye 71 productos pero FCT_INV solo 45?
  proposed_answer: 'Propuesta: el inventario solo rastrea productos de abarrotes o artículos de tienda. Confirmar
    si los platillos de restaurante no tienen inventario controlado.'
- question: ¿Qué moneda, tasa de IVA y base de importes aplican a todas las tablas?
  proposed_answer: 'Propuesta: pesos mexicanos y IVA general de 16%. Confirmar la base de IMP_BRT (con o sin IVA).'
