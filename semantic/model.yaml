- name: DIM_FEC
  role: dimension
  business_name: Calendario (dimensión de fechas)
  description: 'Catálogo de días calendario que permite analizar ventas, devoluciones e inventario por año, mes,
    semana, día de la semana y festivo. Cubre del 2025-01-01 al 2026-11-11 (680 días, sin huecos ni nulos). La clave
    FEC_ID tiene formato AAAAMMDD. Es referenciada por FCT_VTA, FCT_DEV y FCT_INV, por lo que se asume que estas
    tablas son de ventas, devoluciones e inventario (supuesto). Preguntas abiertas: (1) ¿El calendario se extenderá
    más allá de noviembre de 2026? (2) ¿FES_FLG marca festivos nacionales mexicanos o también días de promoción
    de la cadena? (supuesto: festivos oficiales).'
  grain: Un día calendario (una fila por fecha).
  row_count: 680
  primary_key:
  - FEC_ID
  columns:
  - name: FEC_ID
    data_type: NUMBER(38,0)
    business_name: Clave de fecha
    description: Clave primaria de la dimensión en formato numérico AAAAMMDD (ej. 20250101). Es la llave que usan
      las tablas de hechos para unirse con el calendario.
    role: key
    synonyms:
    - id de fecha
    - clave de día
    - llave de fecha
    values: {}
    samples: []
    num_distinct: 680
  - name: FEC
    data_type: DATE
    business_name: Fecha
