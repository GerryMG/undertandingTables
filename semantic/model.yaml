  - name: SEG_CVE
    data_type: VARCHAR2
    business_name: Segmento del cliente
    description: 'Código de segmento al que pertenece el cliente. Tiene 3 valores: GEN (el más frecuente, 1190 clientes),
      FRE (615) y EMP (196). La decodificación es supuesta, a confirmar con el negocio.'
    role: code
