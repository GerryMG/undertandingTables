    (aceite vegetal, yogur). Tiene 71 productos, identificados por PRD_ID, y es referenciada por los hechos de devoluciones,
    inventario y ventas. (supuesto) El precio de lista es el precio de referencia del catálogo y no necesariamente
    el precio cobrado en cada venta.
  grain: ''
  row_count: 71
  primary_key:
