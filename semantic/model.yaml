- name: DIM_LIN
  role: lookup
  business_name: Catálogo de líneas de producto
  description: Catálogo pequeño de líneas de producto (categorías) que se usa para clasificar los productos de la
    cadena. Tiene 9 líneas, cada una con un identificador, una descripción y un tipo de código. Es referenciado
    por DIM_PROD mediante LIN_ID. Por las descripciones (Platos fuertes, Entradas, Postres, Abarrotes, Lácteos,
    Limpieza), parece agrupar productos de restaurantes y de tiendas de autoservicio (supuesto). El significado
    exacto de LIN_TP no está documentado; la decodificación propuesta es supuesta.
  grain: ''
  row_count: 9
  primary_key:
  - LIN_ID
  columns:
  - name: LIN_ID
    data_type: NUMBER(38,0)
    business_name: Identificador de línea
    description: Clave primaria del catálogo de líneas. Valores del 1 al 9, uno por línea. Es la llave que usa DIM_PROD
      para indicar a qué línea pertenece cada producto.
    role: key
    synonyms:
    - id de línea
    - código de línea
    - id de categoría
    values: {}
    samples:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    num_distinct: 9
  - name: LIN_DESC
    data_type: VARCHAR2
    business_name: Descripción de la línea
    description: 'Nombre de la línea de producto, tal como lo usa el negocio. Valores observados: Abarrotes, Lácteos,
      Panadería, Carnes frías, Bebidas, Platos fuertes, Limpieza, Entradas, Postres.'
    role: attribute
    synonyms:
    - línea
    - categoría
    - departamento
    - familia de producto
    - nombre de línea
    values: {}
    samples:
    - Lácteos
    - Panadería
    - Carnes frías
    - Bebidas
    - Platos fuertes
    - Abarrotes
    - Limpieza
    - Entradas
    num_distinct: 9
  - name: LIN_TP
    data_type: VARCHAR2
    business_name: Tipo de línea
    description: 'Código que clasifica la línea según el tipo de venta o de unidad de negocio (supuesto). Tiene
      3 valores distintos: T aparece en 5 líneas, R en 3 y A en 1. Por los nombres, las líneas de restaurante (Entradas,
      Platos fuertes, Postres) corresponderían a R y las de tienda (Abarrotes, Lácteos, Panadería, Carnes frías,
      Bebidas, Limpieza) a T; sin embargo, son 6 candidatas para T y solo hay 5, por lo que una de ellas, con la
      A, es ambigua. Confirmar con el equipo de datos.'
    role: code
    synonyms:
    - tipo de línea
    - tipo de categoría
    - clasificación de línea
    values:
      T: Tienda de autoservicio (supuesto)
      R: Restaurante (supuesto)
      A: Ambos o general (supuesto); no es posible identificar con certeza qué línea tiene este código
    samples:
    - T
    - R
    - A
    num_distinct: 3
  use_in_answers: true
- name: DIM_MTV
  role: lookup
  business_name: Catálogo de motivos de devolución (supuesto)
  description: 'Catálogo pequeño que relaciona un código corto de motivo con su descripción en español. Según su
    comentario original (''Catalogo motivos'') y la tabla que la referencia (FCT_DEV, que por su nombre probablemente
    registra devoluciones), sirve para explicar por qué se devolvió un producto (supuesto). Contiene 5 filas. Los
    valores de ejemplo (producto caducado, producto dañado, error de cobro, insatisfacción del cliente, otro) encajan
    con una cadena de restaurantes y tiendas de autoservicio. Pregunta abierta: confirmar si FCT_DEV es realmente
    de devoluciones y si los motivos aplican también a otros eventos.'
  grain: ''
  row_count: 5
  primary_key:
  - MTV_CVE
  columns:
  - name: MTV_CVE
    data_type: VARCHAR2
    business_name: Clave del motivo
    description: Código corto de 3 letras que identifica cada motivo. Es la clave primaria y la columna que referencia
      FCT_DEV.MTV_CVE. Las abreviaturas parecen derivarse de la descripción (supuesto).
    role: key
    synonyms:
    - código de motivo
    - cve motivo
    - clave motivo
    values:
      CAD: Producto caducado
      DAN: Producto dañado
      ERR: Error de cobro
      INS: Insatisfacción del cliente
      OTR: Otro
    samples:
    - OTR
    - ERR
    - INS
    - CAD
    - DAN
    num_distinct: 5
  - name: MTV_DESC
    data_type: VARCHAR2
    business_name: Descripción del motivo
    description: Nombre en texto legible del motivo, para mostrar en reportes. Cada valor es único en la tabla.
    role: attribute
    synonyms:
    - motivo
    - razón
    - causa
    - descripción del motivo
    - motivo de devolución
    values: {}
    samples:
    - Error de cobro
    - Insatisfacción del cliente
    - Otro
    - Producto caducado
    - Producto dañado
    num_distinct: 5
  use_in_answers: true
- name: DIM_PROD
